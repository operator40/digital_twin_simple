x-app-environment: &app-environment
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-dt_db_cmms}
  POSTGRES_USER: ${POSTGRES_USER:-dt_admin}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
  CMMS_BASE_URL: ${CMMS_BASE_URL:-http://host.docker.internal:9000}
  CMMS_TOKEN: ${CMMS_TOKEN:-replace-me}
  INBOUND_API_KEY: ${INBOUND_API_KEY:-local-api-key}
  DATA_DIR: /data/predictions

x-app-service: &app-service
  image: digital-twin-simple:local
  build:
    context: .
    dockerfile: Dockerfile
  environment: *app-environment
  init: true

services:
  db:
    image: timescale/timescaledb:2.28.3-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dt_db_cmms}
      POSTGRES_USER: ${POSTGRES_USER:-dt_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  db-init:
    <<: *app-service
    command: ["python", "-m", "app.init_db"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-service
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - prediction_data:/data/predictions
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *app-service
    command: ["python", "-m", "app.maintenance.worker"]
    environment:
      PREDICTION_CONFIG_PATH: /app/config/prediction.toml
    volumes:
      - prediction_data:/data/predictions
      - ./config/prediction.toml:/app/config/prediction.toml:ro
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  prediction_data:
